# Netlify hosts only the React site. /api is forwarded to the Node API on Render so the browser sees ONE origin
# (the sign-in cookie is SameSite=Strict and would not work across two sites).
# Replace socialambak-api.onrender.com with the address Render gives your API service.
[build]
  base = "web"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://socialambak-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
